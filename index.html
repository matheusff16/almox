<!doctype html>

<meta charset="utf-8">

<title>Planilha Almoxarifado</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mut:#6b7385;--line:#e2e5ec;--head:#666;--acc:#1f6feb;--ok:#1a9d58;--flash:#fff3b0;--sec:#e9ecf2}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--ink:#e8ebf2;--mut:#9099ad;--line:#2c3240;--head:#3b4252;--acc:#5b9dff;--ok:#3ec97f;--flash:#5a4d12;--sec:#262c38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:17px;margin:0;margin-right:auto}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sec);color:var(--mut);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.chip.on i{background:var(--ok)}
input[type=search],input.txt{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)}
button.danger:hover{border-color:#d33;color:#d33}
main{padding:12px 16px 80px;max-width:1100px;margin:0 auto}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 120px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
thead th{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:8px 6px;font-size:12px;letter-spacing:.04em;text-align:center}
thead th:nth-child(-n+2){text-align:left}
td{padding:2px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.code{color:var(--mut);font-size:12px;width:110px}
td.desc{white-space:normal;min-width:220px}
td.num{width:70px;padding:2px}
td.num input{width:100%;padding:6px 4px;text-align:center;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);font:inherit}
td.num input:hover{border-color:var(--line)}
td.num input:focus{outline:2px solid var(--acc);background:var(--bg)}
td.num input.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{background:var(--flash)}100%{background:transparent}}
td.tot{width:80px;text-align:center;font-weight:700}
tr.sec td{background:var(--sec);font-weight:700;cursor:pointer;padding:8px 10px;position:sticky}
tr.sec .arrow{display:inline-block;width:16px;transition:transform .15s}
tr.sec.closed .arrow{transform:rotate(-90deg)}
tr.add td{padding:4px 10px}
tr.add button{font-size:12px;padding:3px 8px;color:var(--mut)}
.x{border:0;background:none;color:var(--mut);padding:0 4px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:520px;width:92%}
dialog::backdrop{background:#0006}
dialog label{display:block;margin:10px 0 4px;font-size:12px;color:var(--mut)}
dialog input.txt{width:100%}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
#log small{color:var(--mut)}
#login{max-width:340px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
#login input{width:100%;margin:6px 0 10px}
.hide{display:none!important}
.banner{background:var(--flash);padding:8px 16px;font-size:13px;text-align:center;color:#222}
@media (prefers-color-scheme:dark){.banner{color:#fff}}
</style>
</head>

/* ---------- adaptadores de dados ---------- */
// Cada adaptador expõe: subscribe(cb), setCell, addExtra, delExtra, log, subscribeLog, newWeek
function localAdapter(){
  const K='almox_local_v1'; let st; let logs=[];
  const load=()=>{try{st=JSON.parse(localStorage.getItem(K))}catch(e){} if(!st){st={cells:JSON.parse(JSON.stringify(SEED.initial)),extra:{},log:[]};}};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
  load(); const subs=new Set(), lsubs=new Set();
  const emit=()=>{subs.forEach(f=>f({cells:st.cells,extra:st.extra}));lsubs.forEach(f=>f(st.log.slice(-100).reverse()))};
  addEventListener('storage',e=>{if(e.key===K){load();emit()}});
  return {
    live:false,
    async start(){ setTimeout(emit,0) },
    subscribe(f){subs.add(f)}, subscribeLog(f){lsubs.add(f)},
    setCell(id,d,v){ st.cells[id]=st.cells[id]||{}; if(v===null) delete st.cells[id][d]; else st.cells[id][d]=v; save(); emit() },
    addExtra(o){ const k='x'+Date.now().toString(36); st.extra[k]=o; save(); emit() },
    delExtra(k){ delete st.extra[k]; delete st.cells[k]; save(); emit() },
    log(e){ st.log.push(e); st.log=st.log.slice(-300); save(); emit() },
    newWeek(){ st.cells={}; save(); emit() }
  };
}

async function firebaseAdapter(){
  const V='10.12.2', B=`https://www.gstatic.com/firebasejs/${V}/`;
  const {initializeApp}=await import(B+'firebase-app.js');
  const D=await import(B+'firebase-database.js');
  const app=initializeApp(FIREBASE_CONFIG); const db=D.getDatabase(app);
  const root=D.ref(db,'almox'); let auth=null, A=null;
  if(REQUIRE_LOGIN){ A=await import(B+'firebase-auth.js'); auth=A.getAuth(app); }
  const conn=D.ref(db,'.info/connected');
  return {
    live:true, auth, A,
    async start(){
      // semeia valores iniciais da planilha original na primeira vez
      const seeded=await D.get(D.child(root,'seeded'));
      if(!seeded.exists()){ const u={seeded:true}; for(const [id,o] of Object.entries(SEED.initial)) u['cells/'+id]=o; await D.update(root,u); }
    },
    onConn(f){ D.onValue(conn,s=>f(!!s.val())) },
    subscribe(f){ D.onValue(root,s=>{const v=s.val()||{}; f({cells:v.cells||{},extra:v.extra||{}})}) },
    subscribeLog(f){ D.onValue(D.query(D.ref(db,'almox/log'),D.limitToLast(100)),s=>{const a=[];s.forEach(c=>a.push(c.val()));f(a.reverse())}) },
    setCell(id,d,v){ return D.set(D.ref(db,`almox/cells/${id}/${d}`),v) },
    addExtra(o){ return D.set(D.push(D.ref(db,'almox/extra')),o) },
    delExtra(k){ return D.update(root,{['extra/'+k]:null,['cells/'+k]:null}) },
    log(e){ return D.push(D.ref(db,'almox/log'),e) },
    async newWeek(){
      const s=await D.get(D.child(root,'cells'));
      if(s.exists()) await D.set(D.ref(db,'almox/history/'+new Date().toISOString().slice(0,10)+'_'+Date.now()),s.val());
      await D.set(D.child(root,'cells'),null);
    }
  };
}

/* ---------- estado e renderização ---------- */
let ad, state={cells:{},extra:{}}, closed={}, filter='';
const inputs={}; // 'id|dia' -> input
const rowTotals={};

function buildSections(){
  const secs=SEED.sections.map(s=>({key:s.name,name:s.name,items:s.items.map(i=>({...i,extra:false}))}));
  for(const [k,e] of Object.entries(state.extra||{})){
    let s=secs.find(x=>x.key===e.sec); if(!s){s={key:e.sec,name:e.sec,items:[]};secs.push(s)}
    s.items.push({id:k,code:e.code||'',desc:e.desc||'',extra:true});
  }
  return secs;
}
function render(){
  const tb=$('#tb'); const keep=document.activeElement; const focusKey=keep&&keep.dataset?keep.dataset.k:null; const val=keep&&keep.value;
  tb.innerHTML=''; for(const k in inputs) delete inputs[k];
  const f=filter.toLowerCase();
  for(const sec of buildSections()){
    const items=sec.items.filter(i=>!f||(i.code+' '+i.desc).toLowerCase().includes(f));
    if(f&&!items.length) continue;
    const isClosed=closed[sec.key]&&!f;
    let h=`<tr class="sec ${isClosed?'closed':''}" data-sec="${esc(sec.key)}"><td colspan="9"><span class="arrow">▾</span>${esc(sec.name)}</td></tr>`;
    if(!isClosed){
      for(const it of items){
        h+=`<tr data-id="${it.id}"><td class="code">${esc(it.code)}</td><td class="desc">${esc(it.desc)}${it.extra?` <button class="x" data-del="${it.id}" title="Remover item">✕</button>`:''}</td>`;
        for(const d of DAYS) h+=`<td class="num"><input type="number" inputmode="decimal" step="any" data-k="${it.id}|${d}"></td>`;
        h+=`<td class="tot" id="t_${it.id}">0</td></tr>`;
      }
      if(!f) h+=`<tr class="add"><td colspan="9"><button data-add="${esc(sec.key)}">+ novo item em ${esc(sec.name)}</button></td></tr>`;
    }
    tb.insertAdjacentHTML('beforeend',h);
  }
  tb.querySelectorAll('input[data-k]').forEach(i=>{inputs[i.dataset.k]=i});
  paintValues();
  if(focusKey&&inputs[focusKey]){inputs[focusKey].focus();inputs[focusKey].value=val}
}
function paintValues(flashChanged){
  for(const [k,inp] of Object.entries(inputs)){
    const [id,d]=k.split('|'); const v=state.cells?.[id]?.[d];
    if(document.activeElement===inp) continue;
    const s=v==null?'':String(v);
    if(inp.value!==s){ inp.value=s; if(flashChanged){inp.classList.remove('flash');void inp.offsetWidth;inp.classList.add('flash')} }
  }
  for(const it of document.querySelectorAll('tr[data-id]')) updTotal(it.dataset.id);
}
function updTotal(id){
  let t=0; for(const d of DAYS){const i=inputs[id+'|'+d]; if(i){t+=parseFloat(i.value)||0}}
  const el=document.getElementById('t_'+id); if(el) el.textContent=Math.round(t*1000)/1000;
}
const timers={};
function descOf(id){ for(const s of buildSections()) for(const i of s.items) if(i.id===id) return i.desc; return id }
function onInput(e){
  const inp=e.target; if(!inp.dataset.k) return;
  const [id,d]=inp.dataset.k.split('|'); updTotal(id);
  clearTimeout(timers[inp.dataset.k]);
  timers[inp.dataset.k]=setTimeout(()=>commit(inp),350);
}
function commit(inp){
  ensureName(); const [id,d]=inp.dataset.k.split('|');
  const raw=inp.value.trim(); const v=raw===''?null:parseFloat(raw);
  if(raw!==''&&isNaN(v)) return;
  if(((state.cells?.[id]?.[d])??null)===v) return;
  state.cells[id]=state.cells[id]||{}; if(v===null) delete state.cells[id][d]; else state.cells[id][d]=v;
  ad.setCell(id,d,v);
  ad.log({t:Date.now(),u:who,item:descOf(id),d,v});
}

/* ---------- eventos de interface ---------- */
document.addEventListener('input',onInput);
document.addEventListener('focusout',e=>{ if(e.target.dataset&&e.target.dataset.k){clearTimeout(timers[e.target.dataset.k]);commit(e.target);paintValues()} });
document.addEventListener('keydown',e=>{
  if(!(e.target.dataset&&e.target.dataset.k)) return;
  const [id,d]=e.target.dataset.k.split('|'); const rows=[...document.querySelectorAll('tr[data-id]')]; const ri=rows.findIndex(r=>r.dataset.id===id);
  let n=null;
  if(e.key==='Enter'||e.key==='ArrowDown') n=rows[ri+1]&&inputs[rows[ri+1].dataset.id+'|'+d];
  else if(e.key==='ArrowUp') n=rows[ri-1]&&inputs[rows[ri-1].dataset.id+'|'+d];
  if(n){e.preventDefault();n.focus();n.select()}
});
$('#tb').addEventListener('click',e=>{
  const s=e.target.closest('tr.sec'); if(s){closed[s.dataset.sec]=!closed[s.dataset.sec];render();return}
  const a=e.target.closest('[data-add]'); if(a){openAdd(a.dataset.add);return}
  const x=e.target.closest('[data-del]'); if(x&&confirm('Remover este item adicionado por vocês?')) ad.delExtra(x.dataset.del);
});
$('#q').addEventListener('input',e=>{filter=e.target.value.trim();render()});
let addSec='';
function openAdd(sec){addSec=sec;$('#dAddT').textContent='Novo item – '+sec;$('#aCode').value='';$('#aDesc').value='';$('#dAdd').showModal();$('#aDesc').focus()}
$('#aCancel').onclick=()=>$('#dAdd').close();
$('#fAdd').addEventListener('submit',()=>{const d=$('#aDesc').value.trim(); if(d) ad.addExtra({sec:addSec,code:$('#aCode').value.trim(),desc:d})});
$('#bWeek').onclick=async()=>{ if(confirm('Iniciar NOVA SEMANA?\n\nTodos os valores serão zerados (uma cópia fica salva no histórico do Firebase).')){ await ad.newWeek(); } };
$('#bCsv').onclick=()=>{
  const rows=[['Seção','Código','Descrição','SEG','TER','QUA','QUI','SEX','SÁB','TOTAL']];
  for(const s of buildSections()) for(const i of s.items){ const c=state.cells?.[i.id]||{}; const v=DAYS.map(d=>c[d]??''); rows.push([s.name,i.code,i.desc,...v,v.reduce((a,b)=>a+(+b||0),0)]); }
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='almoxarifado_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
};
$('#bLog').onclick=()=>$('#dLog').showModal(); $('#lClose').onclick=()=>$('#dLog').close();
const DN={seg:'SEG',ter:'TER',qua:'QUA',qui:'QUI',sex:'SEX',sab:'SÁB'};
function paintLog(list){ $('#log').innerHTML=list.map(e=>`<div><b>${esc(e.u)}</b> · ${esc(e.item)} · ${DN[e.d]||''} → <b>${e.v==null?'(vazio)':esc(e.v)}</b><br><small>${new Date(e.t).toLocaleString('pt-BR')}</small></div>`).join('')||'<div>Nenhuma alteração ainda.</div>' }
function setStatus(on,txt){ const c=$('#status'); c.classList.toggle('on',on); c.querySelector('span').textContent=txt }

/* ---------- inicialização ---------- */
let firstSnap=true;
function run(){
  $('#app').classList.remove('hide');
  ad.subscribe(s=>{ state={cells:s.cells||{},extra:s.extra||{}}; const sig=JSON.stringify(Object.keys(state.extra)); if(firstSnap||sig!==run.sig){run.sig=sig;render()} else paintValues(true); firstSnap=false });
  ad.subscribeLog(paintLog);
  if(ad.live) ad.onConn(on=>setStatus(on,on?'tempo real · conectado':'sem conexão…'));
  else {setStatus(false,'modo teste (local)');$('#banner').classList.remove('hide')}
  ad.start();
}
(async()=>{
  try{
    if(!FIREBASE_CONFIG){ ad=localAdapter(); return run() }
    ad=await firebaseAdapter();
    if(REQUIRE_LOGIN){
      $('#login').classList.remove('hide');
      const go=async()=>{ $('#lerr').textContent=''; try{await ad.A.signInWithEmailAndPassword(ad.auth,$('#lemail').value.trim(),$('#lpass').value)}catch(e){$('#lerr').textContent='E-mail ou senha incorretos.'} };
      $('#lgo').onclick=go; $('#lpass').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
      ad.A.onAuthStateChanged(ad.auth,u=>{ if(u){ if(!who){who=u.email.split('@')[0];try{localStorage.setItem('almox_who',who)}catch(e){}} $('#login').classList.add('hide'); if(!run.started){run.started=true;run()} } });
    } else run();
  }catch(err){ console.error(err); alert('Erro ao conectar ao Firebase. Verifique a configuração.\n'+err.message); }
})();
</script>
